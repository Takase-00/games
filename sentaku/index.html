<style>
:root{
  --bg:#D6ECF8; --ink:#1C2A35; --sub:#536676; --card:#FFFFFF; --card2:#EEF4F7; --line:#C7D5DD; --stitch:#A9BBC8;
  --accent:#245F93; --accent-ink:#FFFFFF; --hud:rgba(255,255,255,.92); --hud-ink:#1C2A35;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --ink:#E6EDF2; --sub:#A3B4C1; --card:#1C262E; --card2:#25313A; --line:#384854; --stitch:#566B7B;
    --accent:#86BFEA; --accent-ink:#0E1820; --hud:rgba(22,32,40,.92); --hud-ink:#E6EDF2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --ink:#E6EDF2; --sub:#A3B4C1; --card:#1C262E; --card2:#25313A; --line:#384854; --stitch:#566B7B;
  --accent:#86BFEA; --accent-ink:#0E1820; --hud:rgba(22,32,40,.92); --hud-ink:#E6EDF2;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none !important}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#muteBtn{
  position:absolute;top:8px;right:8px;z-index:6;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--hud);color:var(--hud-ink);
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0;
}
#muteBtn svg{display:block;width:22px;height:22px}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;padding:0 16px}
.spacer{flex:1 1 0;min-height:8px}

/* タイトル：竿に干した文字 */
.logo{position:relative;margin:64px 0 0;display:flex;gap:6px;justify-content:center;padding-top:16px;font-weight:900}
.logo::before{content:"";position:absolute;left:-18px;right:-18px;top:6px;height:3px;border-radius:2px;background:#8C9AA4;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.logo span{
  position:relative;display:block;width:min(50px,13vw);height:min(58px,15vw);
  border-radius:3px 3px 9px 9px;background:var(--c);color:var(--k);
  font-size:min(33px,8.6vw);line-height:min(58px,15vw);text-align:center;
  transform-origin:50% -10px;animation:sway 3.4s ease-in-out infinite;animation-delay:var(--d);
  box-shadow:0 3px 0 rgba(0,0,0,.13);
}
.logo span::before{content:"";position:absolute;top:-15px;left:50%;width:9px;height:21px;margin-left:-4.5px;border-radius:2px;background:var(--p);box-shadow:0 0 0 1px rgba(0,0,0,.22) inset}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tagline{margin:14px 0 0;font-size:15px;font-weight:700;color:#1C2A35;background:rgba(255,255,255,.72);padding:3px 12px;border-radius:999px}

/* 洗濯表示タグ風のカード */
.tag{
  position:relative;width:100%;max-width:348px;background:var(--card);color:var(--ink);
  border-radius:4px 4px 14px 14px;padding:26px 22px 18px;
  box-shadow:0 2px 0 var(--line),0 14px 30px rgba(10,30,45,.22);
}
.tag::before{content:"";position:absolute;left:12px;right:12px;top:11px;border-top:2px dashed var(--stitch)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:14.5px;line-height:1.5;font-weight:700}
.rules svg{display:block;width:28px;height:28px}
.ph{display:inline-block}
.note{margin:12px 0 0;font-size:12.5px;color:var(--sub);line-height:1.5}
.best-line{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--sub)}
.best-line b{color:var(--ink);font-size:18px}
.btn{
  display:block;width:100%;min-height:52px;margin-top:14px;border-radius:12px;border:2px solid var(--accent);
  background:var(--card);color:var(--accent);font-size:18px;font-weight:900;cursor:pointer;touch-action:manipulation;
}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}

/* 結果 */
.result-tag{text-align:center;padding-top:30px}
.tag-brand{margin:0;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.score{margin:2px 0 0;font-weight:900;line-height:1}
.score #scoreNum{font-size:72px}
.score .unit{font-size:24px;margin-left:4px}
.rtitle{margin:8px 0 0;font-size:21px;font-weight:900}
.care{margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;text-align:left;border-top:1.5px solid var(--line);padding-top:12px}
.care div{display:flex;justify-content:space-between;gap:6px;font-size:13.5px;white-space:nowrap}
@media (max-width:370px){.care{grid-template-columns:1fr}}
.care dt{color:var(--sub)}
.care dd{margin:0;font-weight:900}
.days{margin:12px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:var(--card2);border-radius:8px;padding:5px 2px 6px}
.day small{display:block;font-size:11.5px;color:var(--sub)}
.day span{display:block;font-size:17px;font-weight:900;letter-spacing:.06em}
.actions{width:100%;max-width:348px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{margin-top:12px}
.toast{margin:10px 0 0;padding:6px 14px;border-radius:999px;background:var(--hud);color:var(--hud-ink);font-size:14px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-height:640px){
  .logo{margin-top:56px}
  .tag{padding:22px 18px 14px}
  .rules li{font-size:13.5px}
  .score #scoreNum{font-size:58px}
}
@media (prefers-reduced-motion: reduce){
  .logo span{animation:none}
}
</style>
</head>

<div id="app">
  <canvas id="cv" aria-label="ゲーム画面"></canvas>
  <button id="muteBtn" type="button" aria-label="音を消す" aria-pressed="false"></button>

  <section id="title" class="overlay" aria-labelledby="ttl">
    <h1 id="ttl" class="logo" aria-label="せんたく日和">
      <span aria-hidden="true" style="--c:#F1C14B;--k:#4E3A0B;--p:#E5493A;--d:-.1s">せ</span>
      <span aria-hidden="true" style="--c:#F7F3EA;--k:#2F5C88;--p:#3D7BD6;--d:-.9s">ん</span>
      <span aria-hidden="true" style="--c:#7DBFDE;--k:#173E54;--p:#F2C230;--d:-1.7s">た</span>

        <li><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="10" y="3" width="8" height="22" rx="2" fill="#E5493A"/><circle cx="14" cy="13" r="2.4" fill="#fff"/><line x1="2" y1="7" x2="26" y2="7" stroke="#8C9AA4" stroke-width="2.5"/></svg><span><span class="ph">服を竿まで</span><span class="ph">引っぱり、</span><span class="ph">両肩（両はし）を</span><span class="ph">洗濯ばさみで</span><span class="ph">2か所とめる</span></span></li>
        <li><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="8" width="22" height="16" rx="2" fill="#7DBFDE"/><line x1="14" y1="5" x2="14" y2="27" stroke="#1C2A35" stroke-width="2" stroke-dasharray="3 2.5"/><path d="M21 6c-3-3-8-3-11 0" fill="none" stroke="#1C2A35" stroke-width="2"/><path d="M8.5 3.5 10 6.5 6.8 7" fill="none" stroke="#1C2A35" stroke-width="2"/></svg><span><span class="ph">乾いたら、</span><span class="ph">端をつかんで</span><span class="ph">重ねて、</span><span class="ph">点線どおりに</span><span class="ph">3回折る</span></span></li>
        <li><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 9h15a4 4 0 1 0-4-4M3 15h20a4 4 0 1 1-4 4M3 21h9" fill="none" stroke="#536676" stroke-width="2.4" stroke-linecap="round"/></svg><span><span class="ph">ずれは全部、</span><span class="ph">しあがりに響く。</span><span class="ph">風の強い日は、</span><span class="ph">とめ方が甘いと</span><span class="ph">飛んでいく</span></span></li>
      </ul>
      <p class="note"><span class="ph">100点は、</span><span class="ph">24回のとめと</span><span class="ph">36回の折りが</span><span class="ph">全部ぴったりの</span><span class="ph">ときだけ。</span></p>
      <p class="best-line">ベスト <b id="bestT">0</b>点</p>
      <button id="startBtn" class="btn primary" type="button">あそぶ</button>
    </div>
    <div class="spacer" style="flex:0 0 14px"></div>
  </section>

  <section id="result" class="overlay" hidden aria-labelledby="resHead">
    <div class="spacer"></div>
    <div class="tag result-tag">
      <h2 id="resHead" class="tag-brand">せんたく日和　しあがり表示</h2>
      <p class="score" aria-live="polite"><span id="scoreNum">0</span><span class="unit">点</span></p>
      <p class="rtitle" id="rTitle"></p>
      <dl class="care">
        <div><dt>ぴったり干し</dt><dd id="stPin"></dd></div>
        <div><dt>ぴったり折り</dt><dd id="stFold"></dd></div>
        <div><dt>風で飛んだ</dt><dd id="stFly"></dd></div>
        <div><dt>山くずれ</dt><dd id="stTop"></dd></div>

      <div class="days" id="days"></div>
      <p class="best-line" id="bestR"></p>
    </div>
    <div class="actions">
      <button id="shareBtn" class="btn primary" type="button">結果をシェア</button>
      <button id="againBtn" class="btn" type="button">もう一度</button>
    </div>
    <p id="toast" class="toast" role="status" hidden></p>
    <div class="spacer"></div>
  </section>

  <div id="live" class="sr" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
const TEST = typeof window !== 'undefined' && !!window.__SENTAKU_TEST;

/* ================= 定数 ================= */
const W = 390, H = 760;          // 論理サイズ
const KH = 0.5;                  // 竿に干したときの縮尺
const POLE_Y = 230, POLE_L = 16, POLE_R = 374;
const BASKET = { x: 195, y: 690, w: 176, h: 86 };
const TC = [195, 392];           // たたむ台の中心
const HANG_TIME = 16, FOLD_TIME = 26;
const PIN_PERF = 1.5, PIN_TAU = 8;      // とめ：ぴったり許容(px) / 0点になるまでの幅
const FOLD_PERF = 1.5, FOLD_TAU = 10;   // 折り：ぴったり許容 / 0点になるまでの幅
const PIN_EXP = 1, FOLD_EXP = 2;        // 1枚のしあがり = とめ^1 × 折り^2
const FOLD_ARM = 35;                    // 角度のずれを測る範囲（点線の中心から±px）
const DAYS = [
  { items: ['towel', 'towel', 'tee'],  A: 2.5, G: 0.40, lv: 1, txt: 'そよ風' },
  { items: ['towel', 'tee', 'pants'],  A: 4.5, G: 0.90, lv: 2, txt: 'ふつう' },
  { items: ['tee', 'pants', 'tee'],    A: 6.5, G: 1.20, lv: 3, txt: 'つよめ' },
  { items: ['pants', 'tee', 'pants'],  A: 8.5, G: 1.45, lv: 4, txt: '強風' }
];
const CLIP_COLORS = ['#E5493A', '#F2C230', '#38A673', '#3D7BD6'];
const KEY_BEST = 'sentaku-best', KEY_MUTE = 'sentaku-muted';

/* ================= 保存 ================= */
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
let muted = TEST ? true : load(KEY_MUTE, '0') === '1';

/* ================= 音 ================= */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f, dur, type, vol, f2, delay) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, f1, f2, delay) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime + (delay || 0), len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t); src.stop(t + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  pick() { tone(520, 0.08, 'triangle', 0.10, 760); },
  drop() { tone(210, 0.14, 'sine', 0.18, 120); },
  clipPerfect() { tone(1500, 0.04, 'square', 0.05, 900); tone(1568, 0.09, 'sine', 0.12, null, 0.05); tone(2093, 0.16, 'sine', 0.10, null, 0.11); },
  clip() { tone(1200, 0.05, 'square', 0.05, 700); },
  miss() { tone(240, 0.22, 'sawtooth', 0.05, 140); },
  gust() { noise(1.1, 0.22, 380, 1700); },
  fly() { tone(1150, 0.8, 'sine', 0.08, 230, 0.15); },
  fold() { tone(260, 0.14, 'sine', 0.09, 540); },
  foldPerfect() { tone(1047, 0.12, 'sine', 0.10); tone(1568, 0.22, 'sine', 0.09, null, 0.07); },
  item(q) { const b = q >= 0.999 ? 784 : q >= 0.7 ? 659 : q >= 0.35 ? 523 : 330; tone(b, 0.1, 'triangle', 0.1); tone(b * 1.25, 0.1, 'triangle', 0.1, null, 0.08); tone(b * 1.5, 0.18, 'triangle', q >= 0.35 ? 0.1 : 0.0001, null, 0.16); },
  tick() { tone(1000, 0.03, 'square', 0.03); },
  day() { tone(660, 0.1, 'triangle', 0.1); tone(990, 0.16, 'triangle', 0.1, null, 0.1); },
  topple() { tone(300, 0.5, 'sawtooth', 0.06, 60); noise(0.4, 0.14, 300, 120, 0.05); },
  timeup() { tone(440, 0.18, 'square', 0.05, 220); tone(330, 0.3, 'square', 0.05, 160, 0.18); },
  result(s) { const seq = s >= 95 ? [523, 659, 784, 1047, 1319] : s >= 50 ? [523, 659, 784, 1047] : [392, 349, 330]; seq.forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, null, i * 0.12)); }
};
function snd(G, name, a) { if (G && G.demo) return; SFX[name](a); }

/* ================= 小道具 ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgb(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function shade(a, f) { return f < 0 ? mixc(a, [0, 0, 0], -f) : mixc(a, [255, 255, 255], f); }
function mkPal(base, ink) { const b = hex2rgb(base); return { b, base: rgb(b), back: rgb(shade(b, -0.14)), edge: rgb(shade(b, -0.45)), wet: mixc(b, [64, 98, 128], 0.3), ink }; }
const PALS = {
  towel: [mkPal('#F3EBDD', '#4D7DAE'), mkPal('#F0B6A2', '#FFFFFF')],
  tee:   [mkPal('#F1C14B', '#7A5A12'), mkPal('#7DBFDE', '#2B5C77'), mkPal('#E6EAEE', '#7B8792')],
  pants: [mkPal('#3E5D86', '#E2A856'), mkPal('#6F604E', '#E6D6B4')]
};

/* ================= 図形 ================= */
function area(p) { let s = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) s += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]); return s / 2; }
function pip(x, y, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function subdivide(poly, m) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / m));
    for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  return out;
}
// 半平面 (p-M)・n <= 0 側を残す
function clipHalf(poly, M, n) {
  const out = [], L = poly.length; if (!L) return out;
  let prev = poly[L - 1], sp = (prev[0] - M[0]) * n[0] + (prev[1] - M[1]) * n[1];
  for (let i = 0; i < L; i++) {

  if (state === 'playing') { drawBanner(c, G); drawHUD(c, G); }
  if (state === 'title') drawFinger(c, bot);
}

/* ================= 画面の切り替え ================= */
let state = 'title', G = null, bot = null;
const $ = id => document.getElementById(id);
const titleEl = $('title'), resultEl = $('result');
function best() { return parseInt(load(KEY_BEST, '0'), 10) || 0; }
function startDemo() { G = newGame({ demo: true }); bot = makeBot(SK.demo); }
function startGame() {
  ensureAudio();
  state = 'playing'; G = newGame({}); bot = null;
  titleEl.hidden = true; resultEl.hidden = true; $('toast').hidden = true;
  announce(G, '1日目。風は' + DAYS[0].txt + '。');
}
let countTimer = null;
function finish() {
  state = 'over';
  const r = computeResult(G);
  const prev = best(), isBest = r.score > prev;
  if (isBest) save(KEY_BEST, r.score);
  $('rTitle').textContent = '「' + r.title + '」';
  $('stPin').textContent = r.stats.pinPerfect + ' / 24';
  $('stFold').textContent = r.stats.foldPerfect + ' / 36';
  $('stFly').textContent = r.stats.flown + '枚';
  $('stTop').textContent = r.stats.toppled + '回';
  const days = $('days'); days.textContent = '';
  r.marks.forEach((m, i) => { const d = document.createElement('div'); d.className = 'day'; const s = document.createElement('small'); s.textContent = (i + 1) + '日目'; const sp = document.createElement('span'); sp.textContent = m; d.appendChild(s); d.appendChild(sp); days.appendChild(d); });
  $('bestR').textContent = isBest ? '自己ベスト更新（前回まで ' + prev + '点）' : 'ベスト ' + Math.max(prev, r.score) + '点';
  const num = $('scoreNum');
  if (countTimer) clearInterval(countTimer);
  if (RM) num.textContent = r.score;
  else {
    let k = 0; const steps = 24; num.textContent = '0';
    countTimer = setInterval(() => { k++; num.textContent = Math.round(r.score * Math.min(1, k / steps)); if (k >= steps) { clearInterval(countTimer); countTimer = null; } }, 40);
  }
  resultEl.hidden = false; $('toast').hidden = true;
  SFX.result(r.score);
  announce(null, r.score + '点。称号は' + r.title + '。');
  setTimeout(() => { try { $('againBtn').focus({ preventScroll: true }); } catch (e) {} }, 60);
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2200); }
async function share() {
  const r = G && G.result; if (!r) return;
  const url = location.href.split('#')[0];
  const text = 'せんたく日和で' + r.score + '点\n称号「' + r.title + '」\n' + r.marks.join(' ') + '\n#せんたく日和\n' + url;
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const w = window.open('https://x.com/intent/post?text=' + encodeURIComponent(text), '_blank');
    if (w) { try { w.opener = null; } catch (e) {} return; }
  } catch (e) {}
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); return; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('コピーしました');
  } catch (e) { toast('コピーできませんでした'); }
}
const ICON_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function syncMute() { const b = $('muteBtn'); b.innerHTML = muted ? ICON_OFF : ICON_ON; b.setAttribute('aria-label', muted ? '音を出す' : '音を消す'); b.setAttribute('aria-pressed', muted ? 'true' : 'false'); }

/* ================= 起動 ================= */
let activePid = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - OX) / S, (e.clientY - r.top - OY) / S]; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'playing' || activePid !== null) return;
  ensureAudio(); activePid = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toLogical(e); onDown(G, p[0], p[1]); e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (e.pointerId !== activePid || state !== 'playing') return; const p = toLogical(e); onMove(G, p[0], p[1]); });
cv.addEventListener('pointerup', e => { if (e.pointerId !== activePid) return; activePid = null; if (state !== 'playing') return; const p = toLogical(e); onUp(G, p[0], p[1]); });
cv.addEventListener('pointercancel', e => { if (e.pointerId !== activePid) return; activePid = null; if (G) onCancel(G); });
document.addEventListener('contextmenu', e => e.preventDefault());
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('shareBtn').addEventListener('click', share);
$('muteBtn').addEventListener('click', () => { muted = !muted; save(KEY_MUTE, muted ? '1' : '0'); syncMute(); if (!muted) { ensureAudio(); tone(880, 0.08, 'triangle', 0.1); } });
window.addEventListener('resize', resize);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readCss); } catch (e) {}
try { new MutationObserver(readCss).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] }); } catch (e) {}

$('bestT').textContent = best();
syncMute(); readCss(); resize(); startDemo();
let last = 0;
function frame(ts) {
  const now = ts / 1000; let dt = last ? now - last : 0; last = now; dt = Math.min(dt, 0.05);
  if (window.__sentakuSpeed) dt *= window.__sentakuSpeed;
  if (state === 'title') {
    if (bot) bot.step(G, dt);
    update(G, dt);
    if (G.phase === 'end') startDemo();
  } else if (state === 'playing') {
    if (window.__sentakuHook) window.__sentakuHook(G, dt);
    update(G, dt);
    if (G.phase === 'end') finish();
  } else {
    updateFx(G, dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
