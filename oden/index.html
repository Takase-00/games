<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>おでん番｜60秒のおでん屋台ミニゲーム</title>
<meta name="description" content="具ごとに煮え方がちがうおでん鍋。お客さんの注文に合わせて、食べ頃の具を出そう。煮すぎた大根は崩れ、早すぎる卵は白いまま。60秒のミニゲームです。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="おでん番">
<meta property="og:title" content="おでん番｜60秒のおでん屋台ミニゲーム">
<meta property="og:description" content="具ごとに煮え方がちがうおでん鍋。注文に合わせて食べ頃の具を出し、称号「おでん屋の大将」をめざそう。">
<meta property="og:url" content="https://takase-00.github.io/games/oden/">
<meta property="og:image" content="https://takase-00.github.io/games/oden/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8D%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --bg:#DCE1EA; --bg2:#CDD4E0; --ink:#19203A; --sub:#4E5873;
  --accent:#C63A24; --accent-ink:#FFF7F0; --focus:#1D5FD0;
  --wall:#E6E9F0; --wall2:#D3D9E5; --noren:#263463; --noren-ink:#F4F1EA;
  --counter:#8A5B2B; --counter-top:#B9874E;
  --bubble:#FBFBFD; --bubble-line:#B7C0D2; --bubble-ink:#19203A; --bubble-sub:#5B6680;
  --tray:#CDD4E0; --tray-btn:#F4F6FA; --tray-line:#A9B3C7;
  --veil:rgba(220,225,234,.95); --veil-soft:rgba(220,225,234,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10142A; --bg2:#181E38; --ink:#ECEFF7; --sub:#A3ABC4;
    --accent:#D8472F; --accent-ink:#FFF7F0; --focus:#8DB6FF;
    --wall:#161C34; --wall2:#1E2645; --noren:#33447F; --noren-ink:#F4F1EA;
    --counter:#523617; --counter-top:#7A5530;
    --bubble:#222A47; --bubble-line:#3A4570; --bubble-ink:#ECEFF7; --bubble-sub:#A8B1CC;
    --tray:#181E38; --tray-btn:#232B4A; --tray-line:#39436B;
    --veil:rgba(16,20,42,.95); --veil-soft:rgba(16,20,42,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10142A; --bg2:#181E38; --ink:#ECEFF7; --sub:#A3ABC4;
  --accent:#D8472F; --accent-ink:#FFF7F0; --focus:#8DB6FF;
  --wall:#161C34; --wall2:#1E2645; --noren:#33447F; --noren-ink:#F4F1EA;
  --counter:#523617; --counter-top:#7A5530;
  --bubble:#222A47; --bubble-line:#3A4570; --bubble-ink:#ECEFF7; --bubble-sub:#A8B1CC;
  --tray:#181E38; --tray-btn:#232B4A; --tray-line:#39436B;
  --veil:rgba(16,20,42,.95); --veil-soft:rgba(16,20,42,.18);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#app{position:relative;height:100%;max-width:500px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

/* ---- 上部の表示 ---- */
#hud{position:relative;flex:0 0 auto;height:54px;display:flex;align-items:center;gap:10px;padding:0 58px 4px 12px}
.hud-box{display:flex;align-items:baseline;gap:4px;transition:opacity .2s}
#hud.idle .hud-box,#hud.idle #timeBar{opacity:0}
.hud-lbl,.hud-unit{font-size:12px;font-weight:700;color:var(--sub)}
.hud-num{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.hud-score{margin-left:auto}
.hud-score .hud-num{font-size:22px}
#timeBox.hurry .hud-num{color:var(--accent);animation:beat .5s ease-in-out infinite alternate}
#timeBar{position:absolute;left:12px;right:58px;bottom:5px;height:4px;border-radius:2px;background:var(--bg2);overflow:hidden}
#timeFill{display:block;height:100%;width:100%;background:var(--ink);opacity:.5;transform-origin:left center}
#mute{position:absolute;top:5px;right:6px;z-index:30;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--tray-line);background:var(--tray-btn);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
#mute svg{display:block}
#mute .x{display:none}
#mute.muted .x{display:inline}
#mute.muted .w{display:none}

/* ---- 鍋とお客さん（Canvas） ---- */
#stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cells{position:absolute;inset:0;pointer-events:none}
.cell{position:absolute;pointer-events:auto;background:transparent;border:0;margin:0;padding:0;border-radius:10px;cursor:pointer;touch-action:none}
#banner{position:absolute;left:0;right:0;top:40%;z-index:5;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--brush);font-size:64px;line-height:1;color:#FFF3E2;-webkit-text-stroke:3px #7A1A0C;paint-order:stroke fill;text-shadow:0 4px 0 rgba(90,16,6,.6)}
#banner.show{animation:banner 1.3s ease-out forwards}

/* ---- 具のバット ---- */
#tray{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px 6px 8px;
  background:var(--tray);border-top:1.5px solid var(--tray-line);touch-action:manipulation}
#tray.shake{animation:shake .3s}
.ing{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:76px;padding:4px 0 5px;
  border-radius:12px;border:1.5px solid var(--tray-line);background:var(--tray-btn);cursor:pointer;touch-action:manipulation;transition:transform .08s}
.ing.press{transform:scale(.93)}
.ing.flash{box-shadow:inset 0 0 0 3px var(--accent)}
.ing-ic{width:38px;height:38px;display:block;pointer-events:none}
.ing-name{font-weight:900;font-size:min(12px,2.9vw);letter-spacing:-.04em;white-space:nowrap;line-height:1.25}
.ing-sec{font-size:min(10.5px,2.6vw);font-weight:700;color:var(--sub);line-height:1.1}
.cell:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.ing:focus-visible,.btn:focus-visible,#mute:focus-visible,.btn-link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---- 重ねる画面 ---- */
.overlay{position:absolute;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;touch-action:manipulation}
.title{display:flex;flex-direction:column;background:var(--veil-soft)}
.title-top{padding:14px 18px 30px;text-align:center;background:linear-gradient(to bottom,var(--veil) 0,var(--veil) calc(100% - 30px),rgba(0,0,0,0) 100%)}
.lantern{display:flex;flex-direction:column;align-items:center;margin:0 auto 4px;transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite alternate}
.lt-string{display:block;width:2px;height:10px;background:#1B1410}
.lt-cap{display:block;width:64px;height:12px;border-radius:4px;background:#1B1410;position:relative;z-index:1}
.lt-body{position:relative;display:grid;place-items:center;width:118px;height:148px;margin:-3px 0;border-radius:46% / 32%;
  background:radial-gradient(ellipse at 38% 30%,#FF9468 0,#DD4024 50%,#A3230F 100%);box-shadow:0 0 46px rgba(255,96,48,.55);overflow:hidden}
.lt-body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(70,0,0,.18) 0 2px,transparent 2px 15px)}
.lt-text{position:relative;writing-mode:vertical-rl;font-family:var(--brush);font-size:31px;line-height:1;letter-spacing:.04em;color:#1A0D07}
.lt-tassel{display:block;width:8px;height:16px;border-radius:0 0 4px 4px;background:#1B1410}
.catch{margin:8px 0 10px;font-size:13px;font-weight:700;color:var(--sub)}
.rules{list-style:none;margin:0 auto;padding:9px 12px;max-width:350px;text-align:left;background:var(--bubble);
  border:1.5px solid var(--bubble-line);border-radius:14px}
.rules li{display:flex;align-items:center;gap:9px;margin:4px 0;font-size:13.5px;font-weight:700;line-height:1.45;color:var(--bubble-ink)}
.tag{flex:0 0 auto;min-width:46px;padding:3px 6px 2px;border-radius:4px;text-align:center;font-family:var(--brush);font-size:14px;line-height:1.2;
  background:#C9965C;color:#2A1606;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.title-mid{flex:1 1 auto;min-height:70px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.demo-chip{font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;background:rgba(20,24,44,.78);color:#F4F1EA}
.title-bot{padding:26px 18px 14px;text-align:center;background:linear-gradient(to top,var(--veil) 0,var(--veil) calc(100% - 26px),rgba(0,0,0,0) 100%)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:14px;
  border:2px solid var(--ink);background:var(--tray-btn);font-weight:900;font-size:17px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(60,10,4,.35)}
.btn:active{transform:translateY(2px)}
#startBtn{width:100%;max-width:340px;font-size:18px}
.best{margin:9px 0 0;font-size:13px;font-weight:700;color:var(--sub)}
.best b{font-weight:900;color:var(--ink)}
.ver{margin:4px 0 0;font-size:11px;font-weight:700;color:var(--sub)}

.result{background:var(--veil);padding:58px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.slip{position:relative;width:100%;max-width:360px;padding:18px 20px 16px;border-radius:2px;color:#2B2018;
  background:#FBF6EA repeating-linear-gradient(to bottom,transparent 0 29px,rgba(184,50,28,.09) 29px 30px);box-shadow:0 12px 28px rgba(0,0,0,.3)}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:10px;
  background:radial-gradient(circle at 7px 5px,var(--bg) 3.5px,rgba(0,0,0,0) 4px) 0 0/14px 10px repeat-x}
.slip::before{top:-5px}
.slip::after{bottom:-5px}
.slip-head{border-bottom:3px double #B8321C;padding-bottom:6px;margin-bottom:8px}
.slip-kanji{font-family:var(--brush);font-size:26px;letter-spacing:.3em;color:#B8321C}
.slip-lbl{margin:6px 0 0;font-size:12px;font-weight:700;color:#7A6552}
.slip-yen{margin:0;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.slip-title{margin:2px 0 0;font-family:var(--brush);font-size:34px;line-height:1.25;white-space:nowrap}
.slip-note{margin:4px 0 10px;font-size:13px;font-weight:700;line-height:1.55;color:#4A3A2C}
.slip-stats{margin:0;padding-top:8px;border-top:1px dashed #C9B48E;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.slip-stats dt{font-weight:700;color:#5A4838}
.slip-stats dd{margin:0;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.stamp{position:absolute;top:10px;right:16px;width:64px;height:64px;border:3px solid #C23A22;border-radius:50%;display:grid;place-items:center;
  font-family:var(--brush);font-size:21px;color:#C23A22;transform:rotate(-14deg);opacity:.85}
.stamp.newbest{top:84px;right:12px;width:auto;height:auto;padding:3px 8px;border-radius:6px;font-size:18px;transform:rotate(9deg);animation:stampIn .45s ease-out both}
.res-btns{display:flex;gap:10px;width:100%;max-width:360px}
.res-btns .btn{flex:1 1 0;padding:0 10px}
.btn-link{min-height:44px;padding:8px 14px;border:0;background:none;font-weight:700;color:var(--sub);text-decoration:underline;cursor:pointer}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:40;max-width:90vw;padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes stampIn{0%{opacity:0;transform:rotate(9deg) scale(2)}100%{opacity:.9;transform:rotate(9deg) scale(1)}}
@media (max-height: 640px){
  .title-top{padding:8px 14px 24px}
  .lt-body{width:92px;height:112px}
  .lt-text{font-size:24px}
  .lt-cap{width:52px;height:10px}
  .catch{margin:5px 0 7px;font-size:12px}
  .rules li{font-size:12.5px;margin:2px 0}
  .title-bot{padding:20px 14px 10px}
  #startBtn{min-height:48px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  #banner.show{opacity:1}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="idle">
    <div class="hud-box" id="timeBox"><span class="hud-lbl">残り</span><span class="hud-num" id="timeVal">60</span><span class="hud-unit">秒</span></div>
    <div class="hud-box hud-score"><span class="hud-lbl">売上</span><span class="hud-num" id="scoreVal">¥0</span></div>
    <div id="timeBar" aria-hidden="true"><i id="timeFill"></i></div>
  </header>
  <button id="mute" type="button" aria-label="効果音を消す" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <g class="w" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g>
      <g class="x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9l5 6M21 9l-5 6"/></g>
    </svg>
  </button>

  <main id="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div id="cells" role="group" aria-label="おでん鍋。具をタップするとお客さんに出す"></div>
    <div id="banner" aria-hidden="true"></div>
  </main>
  <nav id="tray" aria-label="具を鍋に入れる"></nav>

  <section id="titleScreen" class="overlay title" aria-labelledby="titleHead">
    <div class="title-top">
      <div class="lantern" aria-hidden="true">
        <span class="lt-string"></span>
        <span class="lt-cap"></span>
        <span class="lt-body"><span class="lt-text">おでん番</span></span>
        <span class="lt-cap"></span>
        <span class="lt-tassel"></span>
      </div>
      <h1 id="titleHead" class="sr-only">おでん番</h1>
      <p class="catch">具ごとに煮え方がちがう。食べ頃を見きわめよう。</p>
      <ul class="rules">
        <li><span class="tag">入れる</span>下の具をタップすると鍋に入る</li>
        <li><span class="tag">出す</span>食べ頃の具をタップしてお客さんへ。注文にない具を出すと売上から引かれる</li>
        <li><span class="tag">60秒</span>煮すぎて溶けると売上から引かれる。早いと味がしみない</li>
      </ul>
    </div>
    <div class="title-mid"><span class="demo-chip">お手本デモ</span></div>
    <div class="title-bot">
      <button id="startBtn" class="btn primary" type="button">のれんを出す（開店）</button>
      <p class="best">これまでの最高売上 <b id="bestTitle">¥0</b></p>
      <p class="ver" id="verLine"></p>
    </div>
  </section>

  <section id="resultScreen" class="overlay result" hidden aria-labelledby="resHead">
    <div class="slip" id="slip">
      <div class="slip-head"><span class="slip-kanji">御勘定</span></div>
      <h2 id="resHead" class="sr-only">今日の結果</h2>
      <p class="slip-lbl">本日の売上</p>
      <p class="slip-yen" id="resYen">¥0</p>
      <p class="slip-lbl">称号</p>
      <p class="slip-title" id="resTitle"></p>
      <p class="slip-note" id="resNote"></p>
      <dl class="slip-stats" id="resStats"></dl>
      <div class="stamp" aria-hidden="true">毎度</div>
      <div class="stamp newbest" id="newBest" aria-hidden="true" hidden>新記録</div>
    </div>
    <div class="res-btns">
      <button id="againBtn" class="btn primary" type="button">もう一度</button>
      <button id="shareBtn" class="btn" type="button">結果をシェア</button>
    </div>
    <button id="toTitle" class="btn-link" type="button">タイトルへ</button>
    <p class="sr-only" id="resLive" aria-live="polite"></p>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/* =========================================================
   おでん番
   ロジック（DOMに依存しない部分）
   ========================================================= */
const VERSION = 'v2.2';
const DURATION = 60;        // 1回のプレイ時間（秒）
const MELT = 9;             // 煮すぎになってから、溶けて消えるまでの秒数
const NAMA_RATIO = 0.55;    // 食べ頃になる時刻のこの割合までは「生」
const GOKU_BAND = 0.2;      // 食べ頃の窓の中央 ±20% が「極上」
const SEATS = 4, COLS = 4, ROWS = 3, CELLS = COLS*ROWS;
const GOOD = 0.9, BEST = 1.5;
const LOSS_RATE = 1.0;      // 食品ロス（まかない・煮すぎて溶けた具）は、値段のこの割合を売上から引く

// ready: 食べ頃になるまでの秒数 / win: 食べ頃が続く秒数 / price: 値段 / w: 注文される重み
const TYPES = {
  daikon:   { name:'大根',       ready:9, win:4.5, price:150, w:1.2 },
  tamago:   { name:'卵',         ready:6, win:5,   price:120, w:1.2 },
  chikuwa:  { name:'ちくわ',     ready:3, win:3.5, price:100, w:1.0 },
  hanpen:   { name:'はんぺん',   ready:2, win:2.2, price:120, w:0.9 },
  konnyaku: { name:'こんにゃく', ready:5, win:6,   price:100, w:1.0 },
  kinchaku: { name:'餅巾着',     ready:7, win:3,   price:180, w:0.8 },
};
const TYPE_KEYS = Object.keys(TYPES);
const STAGE_LABEL = { nama:'生', kata:'△かため', ok:'◎食べ頃', goku:'★極上', kuta:'×煮すぎ' };
// お客さんの好み別の評価（値段にかける倍率）
const VALUE = {
  normal: { nama:0,   kata:0.4, ok:1.0, goku:1.5, kuta:0.3 },
  kuta:   { nama:0,   kata:0.2, ok:0.9, goku:1.0, kuta:1.5 },
  kata:   { nama:0.3, kata:1.5, ok:0.9, goku:0.9, kuta:0.2 },
};
const IDEAL = { normal:'goku', kuta:'kuta', kata:'kata' };
const PREF_LABEL = { normal:'ご注文', kuta:'くたくた好き', kata:'かため好き' };
const LOOK_KINDS = ['salary','ol','gakusei','obachan','worker'];
const SKINS = ['#F2D3B3','#E9C29E','#D9A77C','#C68B60'];

// 称号の基準（売上）
const RANK_S = 12000, RANK_A = 8500, RANK_B = 5500, RANK_C = 3000;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function stageOf(it){
  const T = TYPES[it.type], t = it.t;
  if (t < T.ready*NAMA_RATIO) return 'nama';
  if (t < T.ready) return 'kata';
  if (t < T.ready + T.win){
    return Math.abs(t - (T.ready + T.win/2)) <= T.win*GOKU_BAND ? 'goku' : 'ok';
  }
  return 'kuta';
}
// アイコンを描くときの代表的な煮え時間
function stageTime(type, stage){
  const T = TYPES[type];
  switch (stage){
    case 'nama': return 0;
    case 'kata': return T.ready*0.8;
    case 'ok':   return T.ready + T.win*0.12;
    case 'goku': return T.ready + T.win*0.5;
    case 'kuta': return T.ready + T.win + MELT*0.4;
  }
  return 0;
}

function newGame(opts){
  opts = opts || {};
  const seed = (opts.seed != null) ? opts.seed : (Math.random()*1e9)|0;
  const dur = opts.duration || DURATION;
  const g = {
    rnd: mulberry32(seed), demo: !!opts.demo,
    t:0, duration:dur, timeLeft:dur, ended:false,
    cells: new Array(CELLS).fill(null), seats: new Array(SEATS).fill(null),
    spawnCd: [0.4, 1.4, 2.6, 4.0], score:0, uid:0, custCount:0, events:[], aiCd:0.8,
    stats: { served:0, best:0, good:0, nama:0, kata:0, ok:0, goku:0, kuta:0, makanai:0, melted:0, overFail:0,
             crumble:0, whiteEgg:0, angry:0, happy:0, done:0, ojii:0, kid:0, tips:0, customers:0, loss:0, meltLoss:0 },
  };
  return g;
}
// 食品ロスで売上から引く額（売上はマイナスにしない）
function takeLoss(g, type){
  const loss = Math.min(g.score, Math.round(TYPES[type].price * LOSS_RATE / 10) * 10);
  g.score -= loss;
  return loss;
}
function mkItem(g, type, t){
  const it = { id:++g.uid, type, t:t||0, stage:null, seed:1+Math.floor(g.rnd()*997) };
  it.stage = stageOf(it);
  return it;
}
function pickType(g){
  let tot = 0; for (const k of TYPE_KEYS) tot += TYPES[k].w;
  let r = g.rnd()*tot;
  for (const k of TYPE_KEYS){ r -= TYPES[k].w; if (r <= 0) return k; }
  return TYPE_KEYS[0];
}
function spawn(g, si){
  const el = g.t, r = g.rnd();
  let n;
  if (g.custCount === 0) n = 1;
  else if (el < 10) n = r < 0.55 ? 1 : 2;
  else if (el < 30) n = r < 0.25 ? 1 : (r < 0.75 ? 2 : 3);
  else n = r < 0.4 ? 2 : 3;
  let pref = 'normal';
  const r2 = g.rnd();
  if (g.custCount >= 2){ if (r2 < 0.15) pref = 'kuta'; else if (r2 < 0.30) pref = 'kata'; }
  const order = [];
  for (let k=0; k<n; k++){
    const type = g.custCount === 0 ? (g.rnd() < 0.5 ? 'tamago' : 'konnyaku') : pickType(g);
    order.push({ type, served:false, stage:null, value:0, yen:0 });
  }
  let maxT = 0;
  for (const o of order){ const T = TYPES[o.type]; maxT = Math.max(maxT, T.ready + (pref === 'kuta' ? T.win : 0)); }
  // 後半ほど、お客さんはせっかちになる（最大15%短く）
  let pat = (9 + n*3.5 + maxT*0.6) * (1 - 0.15*Math.min(1, el/g.duration));
  if (pref === 'kuta') pat *= 1.15;
  if (pref === 'kata') pat *= 0.95;
  const kind = pref === 'kuta' ? 'ojii' : pref === 'kata' ? 'kodomo' : LOOK_KINDS[Math.floor(g.rnd()*LOOK_KINDS.length)];
  const look = { kind, skin: SKINS[Math.floor(g.rnd()*SKINS.length)] };
  g.seats[si] = { id:++g.uid, order, pref, patience:pat, maxPatience:pat, phase:'wait', phaseT:0, age:0,
                  look, mood:'normal', moodT:0, angry:false, allGood:false };
  g.custCount++; g.stats.customers++;
  g.events.push({ k:'arrive', seat:si });
}

function update(g, dt){
  if (g.ended) return;
  g.t += dt;
  g.timeLeft = Math.max(0, g.duration - g.t);
  for (let i=0; i<CELLS; i++){
    const it = g.cells[i]; if (!it) continue;
    it.t += dt;
    const st = stageOf(it);
    if (st !== it.stage){ it.stage = st; g.events.push({ k:'stage', idx:i, type:it.type, stage:st }); }
    const T = TYPES[it.type];
    if (it.t > T.ready + T.win + MELT){
      g.cells[i] = null;
      g.stats.melted++; g.stats.overFail++;
      if (it.type === 'daikon') g.stats.crumble++;
      const loss = takeLoss(g, it.type); g.stats.meltLoss += loss;
      g.events.push({ k:'melt', idx:i, type:it.type, loss });
    }
  }
  for (let si=0; si<SEATS; si++){
    const c = g.seats[si];
    if (!c){
      g.spawnCd[si] -= dt;
      if (g.spawnCd[si] <= 0 && g.timeLeft > 5) spawn(g, si);
      continue;
    }
    c.age += dt;
    if (c.moodT > 0) c.moodT -= dt;
    if (c.phase === 'wait'){
      c.patience -= dt;
      if (c.patience <= 0){
        c.patience = 0; c.phase = 'leave'; c.phaseT = 0; c.angry = true;
        g.stats.angry++;
        g.events.push({ k:'angry', seat:si });
      }
    } else if (c.phase === 'done'){
      c.phaseT += dt;
      if (c.phaseT > 0.6){ c.phase = 'leave'; c.phaseT = 0; }
    } else if (c.phase === 'leave'){
      c.phaseT += dt;
      if (c.phaseT > 0.45){ g.seats[si] = null; g.spawnCd[si] = 0.6 + g.rnd()*1.2; }
    }
  }
  if (g.t >= g.duration){ g.ended = true; g.events.push({ k:'end' }); }
}

function addItem(g, type){
  if (g.ended || !TYPES[type]) return -1;
  const idx = g.cells.indexOf(null);
  if (idx < 0){ g.events.push({ k:'full' }); return -1; }
  g.cells[idx] = mkItem(g, type, 0);
  g.events.push({ k:'add', idx, type });
  return idx;
}

// その具をいちばん喜ぶお客さん（同じなら待ちくたびれそうな人）を探す
function bestTaker(g, it, st){
  st = st || stageOf(it);
  let best = { c:null, v:-1, si:-1, row:-1 };
  for (let si=0; si<SEATS; si++){
    const c = g.seats[si];
    if (!c || c.phase !== 'wait') continue;
    const row = c.order.findIndex(o => !o.served && o.type === it.type);
    if (row < 0) continue;
    const v = VALUE[c.pref][st];
    if (v > best.v + 1e-9 || (Math.abs(v - best.v) < 1e-9 && best.c && c.patience < best.c.patience)) best = { c, v, si, row };
  }
  return best;
}

function serveCell(g, idx){
  if (g.ended) return null;
  const it = g.cells[idx]; if (!it) return null;
  const st = stageOf(it);
  const tk = bestTaker(g, it, st);
  const S = g.stats;
  g.cells[idx] = null;
  const wasted = st === 'kuta' && !(tk.c && tk.c.pref === 'kuta');
  if (st === 'kuta' && it.type === 'daikon') S.crumble++;
  if (!tk.c){
    S.makanai++; if (wasted) S.overFail++;
    const loss = takeLoss(g, it.type); S.loss += loss;
    g.events.push({ k:'makanai', idx, type:it.type, stage:st, t:it.t, seed:it.seed, loss });
    return { k:'makanai', loss };
  }
  const c = tk.c, o = c.order[tk.row], v = tk.v;
  const yen = Math.round(TYPES[it.type].price * v / 10) * 10;
  o.served = true; o.stage = st; o.value = v; o.yen = yen;
  g.score += yen;
  S.served++; S[st]++;
  if (v >= GOOD) S.good++;
  if (v >= BEST) S.best++;
  if (wasted) S.overFail++;
  if (it.type === 'tamago' && (st === 'nama' || st === 'kata') && c.pref !== 'kata') S.whiteEgg++;
  if (c.pref === 'kuta' && v >= BEST) S.ojii++;
  if (c.pref === 'kata' && v >= BEST) S.kid++;
  c.mood = v >= BEST ? 'joy' : (v >= GOOD ? 'happy' : 'sad'); c.moodT = 1.1;
  g.events.push({ k:'serve', idx, seat:tk.si, row:tk.row, type:it.type, stage:st, value:v, yen, pref:c.pref, t:it.t, seed:it.seed });
  if (c.order.every(x => x.served)) completeCustomer(g, c, tk.si);
  return { k:'serve', seat:tk.si, value:v, yen };
}
function completeCustomer(g, c, si){
  const allGood = c.order.every(o => o.value >= GOOD);
  const tip = allGood ? 50*c.order.length : 0;
  g.score += tip; g.stats.tips += tip; g.stats.done++;
  if (allGood) g.stats.happy++;
  c.phase = 'done'; c.phaseT = 0; c.allGood = allGood;
  g.events.push({ k:'complete', seat:si, tip, allGood });
}

// 注文で足りていない具の数（煮すぎていない具を「手持ち」と数える）
function demandOf(g){
  const need = {}, have = {};
  for (const c of g.seats){
    if (!c || c.phase !== 'wait') continue;
    for (const o of c.order) if (!o.served) need[o.type] = (need[o.type]||0) + 1;
  }
  for (const it of g.cells){
    if (!it) continue;
    if (stageOf(it) !== 'kuta') have[it.type] = (have[it.type]||0) + 1;
  }
  return { need, have };
}

// お手本デモと自動テスト用のCPU
function aiDecide(g){
  if (g.ended) return null;
  let pick = -1, pri = 0;
  for (let i=0; i<CELLS; i++){
    const it = g.cells[i]; if (!it) continue;
    const st = stageOf(it), tk = bestTaker(g, it, st);
    if (!tk.c) continue;
    const T = TYPES[it.type];
    let p = 0;
    if (tk.v >= BEST) p = 3;
    else if (tk.v >= GOOD){
      const ideal = IDEAL[tk.c.pref];
      let wait = -1;
      if (ideal === 'goku') wait = T.ready + T.win*(0.5 - GOKU_BAND) + 0.15 - it.t;
      else if (ideal === 'kuta') wait = T.ready + T.win + 0.15 - it.t;
      p = (wait > 0 && tk.c.patience > wait + 2) ? 0 : 2;
    } else if (tk.c.patience < 2.5 && tk.v >= 0.3) p = 1;
    if (p > pri){ pri = p; pick = i; }
  }
  if (pick >= 0) return { k:'cell', i:pick };
  const { need, have } = demandOf(g);
  const empty = g.cells.indexOf(null);
  let add = null, sc = 0;
  for (const k of TYPE_KEYS){
    const d = (need[k]||0) - (have[k]||0);
    if (d > 0){ const v = d*20 + TYPES[k].ready; if (v > sc){ sc = v; add = k; } }
  }
  if (add && empty >= 0) return { k:'tray', type:add };
  if (empty < 0){
    for (let i=0; i<CELLS; i++){ const it = g.cells[i]; if (it && stageOf(it) === 'kuta' && !bestTaker(g, it, 'kuta').c) return { k:'cell', i }; }
    if (add){ for (let i=0; i<CELLS; i++){ const it = g.cells[i]; if (it && !(need[it.type] > 0)) return { k:'cell', i }; } }
  }
  const free = g.cells.filter(x => !x).length;
  if (free >= 5 && g.timeLeft > 12){
    for (const k of ['daikon','tamago','kinchaku']) if (!(have[k] > 0)) return { k:'tray', type:k };
  }
  return null;
}
function aiAct(g){
  const a = aiDecide(g);
  if (!a) return null;
  if (a.k === 'cell') serveCell(g, a.i); else addItem(g, a.type);
  return a;
}

// 称号を決める
function judge(g){
  const s = g.stats, sc = g.score;
  if (s.makanai >= 8 && s.makanai > s.served) return { title:'まかない大臣', note:`お客さんより大将のほうが食べました（${s.makanai}個）。` };
  if (sc >= RANK_S) return { title:'おでんの神様', note:'出汁の香りだけで客が集まる、伝説の屋台です。' };
  if (sc >= RANK_A) return { title:'おでん屋の大将', note:'食べ頃を見きわめる目は、もう一人前以上です。' };
  if (s.crumble >= 6) return { title:'大根クラッシャー', note:`崩した大根は${s.crumble}本。出汁はとびきり濃くなりました。` };
  if (s.melted >= 8) return { title:'煮込みの鬼', note:`${s.melted}個の具が、出汁の中へ消えていきました。` };
  if (s.whiteEgg >= 4) return { title:'白たまご職人', note:`味のしみていない卵を${s.whiteEgg}個出しました。` };
  if (s.served === 0 && s.makanai === 0) return { title:'鍋をながめる人', note:'湯気をながめているうちに、閉店の時間になりました。' };
  if (s.ojii >= 8) return { title:'常連じいさんの推し', note:`くたくたの具で、おじいさんを${s.ojii}回よろこばせました。` };
  if (s.kid >= 8) return { title:'ちびっこの味方', note:`かための具で、子どもを${s.kid}回よろこばせました。` };
  if (s.angry >= 8) return { title:'閑古鳥の番人', note:`${s.angry}人のお客さんが、待ちくたびれて帰りました。` };
  if (sc >= RANK_B) return { title:'一人前の鍋番', note:'大将の背中が見えてきました。' };
  if (sc >= RANK_C) return { title:'屋台の見習い', note:'鍋の前に立つ姿が、さまになってきました。' };
  return { title:'鍋の見張り番', note:'まずは湯気をよく見るところから。' };
}

/* =========================================================
   保存・効果音
   ========================================================= */
function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, String(v)); } catch (e){} }

let muted = load('oden-muted','0') === '1';
let actx = null;
function ensureAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e){}
}
// 周波数, 長さ(秒), 波形, 音量, 終わりの周波数(任意), 開始の遅れ(任意)
function tone(f, dur, type, vol, f2, delay){
  if (muted || !actx) return;
  try {
    const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e){}
}
function sfx(name, d){
  d = d || 0;
  switch (name){
    case 'add':     tone(520,0.13,'sine',0.2,170,d); tone(1100,0.06,'sine',0.05,600,d+0.03); break;
    case 'ready':   tone(1480,0.09,'triangle',0.04,0,d); break;
    case 'over':    tone(170,0.2,'sawtooth',0.05,70,d); break;
    case 'goku':    tone(784,0.1,'triangle',0.16,0,d); tone(988,0.1,'triangle',0.16,0,d+0.08); tone(1319,0.18,'triangle',0.16,0,d+0.16); break;
    case 'good':    tone(660,0.1,'triangle',0.15,0,d); tone(880,0.15,'triangle',0.15,0,d+0.08); break;
    case 'bad':     tone(240,0.2,'square',0.07,150,d); break;
    case 'makanai': tone(320,0.07,'sine',0.18,250,d); tone(300,0.07,'sine',0.18,230,d+0.13); break;
    case 'coin':    tone(1568,0.07,'square',0.06,0,d); tone(2093,0.14,'square',0.06,0,d+0.07); break;
    case 'angry':   tone(330,0.3,'sawtooth',0.06,170,d); break;
    case 'arrive':  tone(880,0.06,'sine',0.05,1250,d); break;
    case 'melt':    tone(260,0.45,'sine',0.09,60,d); break;
    case 'full':    tone(140,0.14,'square',0.08,0,d); break;
    case 'tick':    tone(1000,0.05,'square',0.05,0,d); break;
    case 'clap':    tone(2000,0.035,'square',0.14,1500,d); tone(2000,0.035,'square',0.14,1500,d+0.16); break;
  }
}

/* =========================================================
   具の絵（数値から形を描く）
   ========================================================= */
function hx(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function lc(A,B,t){ t = clamp(t,0,1); return [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]; }
function l3(A,B,C,t){ return t < 0.5 ? lc(A,B,t*2) : lc(B,C,(t-0.5)*2); }
function cs(A,a){ return a == null ? `rgb(${A[0]|0},${A[1]|0},${A[2]|0})` : `rgba(${A[0]|0},${A[1]|0},${A[2]|0},${a})`; }
function sh(A,k){ return k < 0 ? lc(A,[0,0,0],-k) : lc(A,[255,255,255],k); }
function sr(seed,i){ const v = Math.sin(seed*12.9898 + i*78.233)*43758.5453; return v - Math.floor(v); }
function rr(c,x,y,w,h,r){ r = Math.max(0, Math.min(r, w/2, h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ell(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,Math.PI*2); }
function lw(s,k){ return Math.max(1, s*k); }

function itemP(type, t){
  const T = TYPES[type];
  return {
    cook: clamp(t/T.ready, 0, 1),                               // 味のしみ具合
    over: Math.max(0, (t - T.ready - T.win)/MELT),              // 煮すぎの度合い
    late: clamp((t - (T.ready + T.win*0.6))/(T.win*0.4), 0, 1), // 食べ頃の終わりが近い
  };
}
const DK = [[244,241,231],[232,200,140],[198,132,60]];
function dDaikon(c,s,p,seed){
  const r = s*0.44;
  let b = l3(DK[0],DK[1],DK[2],p.cook);
  if (p.over > 0) b = lc(b,[138,80,34],p.over*1.2);
  const edge = sh(b,-0.22);
  c.lineJoin = 'round';
  if (p.over <= 0){
    ell(c,0,0,r,r); c.fillStyle = cs(b); c.fill(); c.lineWidth = lw(s,0.03); c.strokeStyle = cs(edge); c.stroke();
    c.beginPath(); c.arc(0,0,r*0.84,Math.PI*1.1,Math.PI*1.85); c.strokeStyle = cs(sh(b,0.45),0.8); c.lineWidth = lw(s,0.03); c.stroke();
    if (p.cook < 0.7){ ell(c,0,0,r*0.62,r*0.62); c.strokeStyle = cs([255,255,255],0.6*(0.7-p.cook)); c.lineWidth = lw(s,0.02); c.stroke(); }
    c.beginPath(); c.moveTo(-r*0.42,0); c.lineTo(r*0.42,0); c.moveTo(0,-r*0.42); c.lineTo(0,r*0.42);
    c.strokeStyle = cs(sh(b,-0.3),0.75); c.lineWidth = lw(s,0.022); c.stroke();
    if (p.late > 0){
      c.strokeStyle = cs(sh(b,-0.45),0.85); c.lineWidth = lw(s,0.018);
      for (let k=0; k<4; k++){
        const a = sr(seed,k)*Math.PI*2, r0 = r*0.25, len = r*(0.2 + 0.75*p.late);
        c.beginPath(); c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
        for (let j=1; j<=4; j++){ const rad = r0 + len*j/4, aa = a + (sr(seed,k*7+j)-0.5)*0.5; c.lineTo(Math.cos(aa)*rad, Math.sin(aa)*rad); }
        c.stroke();
      }
    }
  } else {
    const o = Math.min(p.over,1.2);
    const n = Math.floor(3 + o*18);
    c.fillStyle = cs(lc(b,DK[1],0.15));
    for (let k=0; k<n; k++){
      const a = sr(seed,100+k)*Math.PI*2, d = r*(0.55 + sr(seed,200+k)*(0.4+o*1.3)), z = s*(0.03 + 0.05*sr(seed,300+k));
      c.save(); c.translate(Math.cos(a)*d, Math.sin(a)*d); c.rotate(sr(seed,400+k)*6); c.fillRect(-z/2,-z/2,z,z*0.8); c.restore();
    }
    const gap = r*(0.1 + o*0.75);
    for (let q=0; q<4; q++){
      const a0 = q*Math.PI/2 + 0.05, a1 = a0 + Math.PI/2 - 0.1, am = (a0+a1)/2;
      c.save(); c.translate(Math.cos(am)*gap, Math.sin(am)*gap); c.rotate((q%2 ? 1 : -1)*o*0.55*(0.5 + sr(seed,q)));

function dKonnyaku(c,s,p,seed){

function readTheme(){
  const s = getComputedStyle(document.documentElement);
  const v = n => s.getPropertyValue(n).trim();
  COL = { bg:v('--bg'), ink:v('--ink'), accent:v('--accent'), wall:v('--wall'), wall2:v('--wall2'), noren:v('--noren'), norenInk:v('--noren-ink'),
          counter:v('--counter'), counterTop:v('--counter-top'), bubble:v('--bubble'), bubbleInk:v('--bubble-ink'),
          bubbleLine:v('--bubble-line'), bubbleSub:v('--bubble-sub') };
}

function layout(){
  const r = el.stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const rim = clamp(Math.round(W*0.026), 7, 12);
  // 鍋の大きさは幅で決め、残りの高さをお客さんの場所に使う
  let cell = Math.floor((W - 16 - rim*2)/COLS);
  const custH = clamp(H - (cell*ROWS + rim*2) - 14, 150, 280);
  const counterH = clamp(Math.round(custH*0.07), 11, 16);
  const bubbleH = clamp(Math.round(custH*0.47), 84, 122);
  const potTop = custH + 6, availH = H - potTop - 6;
  cell = Math.max(36, Math.min(cell, Math.floor((availH - rim*2)/ROWS)));
  const potW = cell*COLS + rim*2, potH = cell*ROWS + rim*2;
  const potX = Math.round((W - potW)/2);
  const potY = Math.round(potTop + Math.max(0, (availH - potH)/2));
  const cells = [];
  for (let i=0; i<CELLS; i++) cells.push({ x:potX + rim + (i%COLS)*cell, y:potY + rim + Math.floor(i/COLS)*cell, s:cell });
  LAYOUT = { custH, counterH, bubbleH, potX, potY, potW, potH, rim, cell, cells, seatW:W/SEATS };
  cellBtns.forEach((b,i) => { const c = cells[i]; b.style.left = c.x+'px'; b.style.top = c.y+'px'; b.style.width = c.s+'px'; b.style.height = c.s+'px'; });
  iconCache.clear();
}

function bubbleGeom(si){
  const L = LAYOUT;
  const x = si*L.seatW + 4, y = 6, w = L.seatW - 8, h = L.bubbleH;
  const pad = 5, headH = Math.round(clamp(h*0.17,14,19)), barH = 6;
  const rowsTop = y + pad + headH + 3;
  const rowH = (h - pad*2 - headH - 3 - barH - 4)/3;
  const ic = Math.max(10, Math.floor(Math.min(rowH - 1, 26)));
  return { x, y, w, h, pad, headH, barH, rowsTop, rowH, ic };
}
function headR(){
  const L = LAYOUT;
  const avail = L.custH - L.counterH - (6 + L.bubbleH + 8);
  return clamp(Math.min(L.seatW*0.23, avail/3), 10, 26);
}
function cellCenter(i){ const c = LAYOUT.cells[i]; return [c.x + c.s/2, c.y + c.s*0.56]; }
function reactPos(si){ const L = LAYOUT; return [si*L.seatW + L.seatW/2, 6 + L.bubbleH + 18]; }

function getIcon(type, stage, px){
  const key = type + '|' + stage + '|' + px;
  let c2 = iconCache.get(key);
  if (c2) return c2;
  c2 = document.createElement('canvas');
  c2.width = c2.height = Math.ceil(px*DPR);
  const x = c2.getContext('2d');
  x.scale(DPR,DPR); x.translate(px/2, px/2 + px*0.03);
  drawItem(x, type, stageTime(type, stage), px*0.82, 7);
  iconCache.set(key, c2);
  return c2;

function addPop(text, x, y, o){
  o = o || {};
  fx.push({ k:'pop', text, x, y, size:o.size || 15, fill:o.fill || '#FFF8EE', age:-(o.delay || 0), life:o.life || 1.1 });
}
function reactText(e){
  const pick = a => a[Math.floor(Math.random()*a.length)];
  if (e.pref === 'kuta'){ if (e.stage === 'kuta') return 'とろとろじゃ〜'; if (e.value >= GOOD) return 'うむ、うまい'; }
  if (e.pref === 'kata'){ if (e.stage === 'kata') return 'これくらいがいい！'; if (e.value >= GOOD) return 'おいしい！'; }
  switch (e.stage){
    case 'goku': return pick(R_GOKU);
    case 'ok':   return pick(R_OK);
    case 'kata': return R_KATA[e.type];
    case 'nama': return R_NAMA[e.type];
    default:     return R_KUTA[e.type];
  }
}
function processEvents(g, silent){
  const L = LAYOUT;
  const snd = (n,d) => { if (!silent) sfx(n,d); };
  for (const e of g.events){
    switch (e.k){
      case 'add': {
        const it = g.cells[e.idx]; if (it) dropAnim.set(it.id, clock);
        const [x,y] = cellCenter(e.idx);
        fx.push({ k:'rip', x, y, s:L.cell, age:0, life:0.55 });
        snd('add'); flashTray(e.type);
        break;
      }
      case 'stage':
        if (e.stage === 'ok') snd('ready');
        else if (e.stage === 'kuta'){ snd('over'); const [x,y] = cellCenter(e.idx); addPop(OVER_TEXT[e.type], x, y - L.cell*0.2, { size:12, fill:'#FFE3C2' }); }
        break;
      case 'serve': {
        const b = bubbleGeom(e.seat);
        const [x0,y0] = cellCenter(e.idx);
        const x1 = b.x + b.pad - 2 + b.ic/2, y1 = b.rowsTop + e.row*b.rowH + b.rowH/2;
        fx.push({ k:'fly', type:e.type, t:e.t, seed:e.seed, x0, y0, x1, y1, s0:L.cell*0.68, s1:b.ic*0.85, age:0, life:reduce ? 0.05 : 0.3 });
        const [rx,ry] = reactPos(e.seat);
        addPop(reactText(e), rx, ry, { size:14, fill:e.value >= GOOD ? '#FFF3C4' : '#FFD6CC' });
        addPop('+¥' + e.yen, b.x + b.w - 24, y1, { size:13, delay:0.28, fill:'#FFE08A', life:0.9 });
        snd(e.value >= BEST ? 'goku' : (e.value >= GOOD ? 'good' : 'bad'));
        if (!silent && e.value < 0.3) shake = 0.22;
        break;
      }
      case 'makanai': {
        const [x,y] = cellCenter(e.idx);
        addPop('まかない（もぐもぐ）', x, y, { size:12 });
        if (e.loss > 0) addPop('−¥' + e.loss, x, y + 18, { size:13, delay:0.2, fill:'#FFD6CC', life:0.9 });
        snd('makanai');
        break;
      }
      case 'complete': {
        const [rx,ry] = reactPos(e.seat);
        addPop(e.allGood ? 'ごちそうさま！' : 'ごちそうさま', rx, ry + 20, { size:13, delay:0.55 });
        if (e.tip > 0){ addPop('心付け +¥' + e.tip, rx, ry + 38, { size:13, delay:0.8, fill:'#FFE08A' }); snd('coin', 0.8); }

function stepParticles(g, dt){
  if (!LAYOUT) return;
  if (reduce){ steam.length = 0; simmer.length = 0; return; }
  const L = LAYOUT;
  for (let i=0; i<CELLS; i++){
    const it = g.cells[i]; if (!it) continue;
    const rate = it.stage === 'goku' ? 7 : it.stage === 'ok' ? 4 : it.stage === 'kuta' ? 2 : 0.5;
    if (Math.random() < rate*dt){
      const c = L.cells[i];
      steam.push({ x:c.x + c.s*(0.3 + Math.random()*0.4), y:c.y + c.s*0.45, vx:(Math.random()-0.5)*10, vy:-(16 + Math.random()*18),
                   r:c.s*(0.05 + Math.random()*0.04), age:0, life:0.9 + Math.random()*0.7 });
    }
  }
  if (Math.random() < 10*dt){
    const ix = L.potX + L.rim, iw = L.potW - L.rim*2, ih = L.potH - L.rim*2;
    simmer.push({ x:ix + Math.random()*iw, y:L.potY + L.rim + Math.random()*ih, r:1.5 + Math.random()*2.5, age:0, life:0.5 + Math.random()*0.6 });
  }
  for (const p of steam){ p.age += dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  for (const b of simmer) b.age += dt;
  steam = steam.filter(p => p.age < p.life); simmer = simmer.filter(b => b.age < b.life);
  if (steam.length > 160) steam.splice(0, steam.length - 160);
}

  c.strokeStyle = 'rgba(60,25,8,.6)'; c.lineWidth = 2; rr(c,ix,iy,iw,ih,9); c.stroke();
  for (let k=1; k<COLS; k++) divider(ix + L.cell*k - 2, iy + 2, 4, ih - 4, true);
  for (let k=1; k<ROWS; k++) divider(ix + 2, iy + L.cell*k - 2, iw - 4, 4, false);
  for (let i=0; i<CELLS; i++) drawCell(g, i);
}
function divider(x, y, w, h, vertical){
  const gr = ctx.createLinearGradient(x, y, vertical ? x + w : x, vertical ? y : y + h);
  gr.addColorStop(0,'#F1F3F4'); gr.addColorStop(1,'#8D969D');
  ctx.fillStyle = gr; ctx.fillRect(x, y, w, h);
}
function drawCell(g, i){
  const c = LAYOUT.cells[i], s = c.s, it = g.cells[i];
  if (!it){
    ctx.fillStyle = 'rgba(255,246,225,.38)'; ctx.font = `700 ${Math.round(clamp(s*0.11,10,14))}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('空き', c.x + s/2, c.y + s/2);
    return;
  }
  const st = it.stage || stageOf(it);
  const tk = bestTaker(g, it, st);
  const p = itemP(it.type, it.t);
  if (tk.v >= GOOD && (state === 'playing' || state === 'title')){
    const pulse = reduce ? 1 : 0.5 + 0.5*Math.sin(clock*7);
    ctx.save(); ctx.setLineDash([7,5]); ctx.lineDashOffset = reduce ? 0 : -clock*20;
    ctx.strokeStyle = `rgba(255,250,230,${0.55 + 0.45*pulse})`; ctx.lineWidth = 3; rr(ctx,c.x + 4,c.y + 4,s - 8,s - 8,10); ctx.stroke();
    ctx.restore();
  }
  let sc = 1, dy = 0;
  const da = dropAnim.get(it.id);
  if (da != null){
    const k = (clock - da)/0.28;
    if (k >= 1) dropAnim.delete(it.id);
    else if (!reduce){ sc = 1 + (1-k)*0.35; dy = -(1-k)*(1-k)*s*0.35; }
  }
  const bob = reduce ? 0 : Math.sin(clock*2.1 + i*1.7)*s*0.014;
  const rot = reduce ? 0 : Math.sin(clock*1.5 + i)*0.035*(1 + Math.min(p.over,1)*2.5);
  ctx.save(); ctx.translate(c.x + s/2, c.y + s*0.56 + bob + dy);
  ell(ctx,0,s*0.07,s*0.3,s*0.22); ctx.fillStyle = 'rgba(95,50,12,.28)'; ctx.fill();
  ctx.rotate(rot); ctx.scale(sc,sc);
  drawItem(ctx, it.type, it.t, s*0.68, it.seed);
  ctx.restore();
  drawChip(c, st);
  drawGauge(c, it);
}
function drawChip(c, st){
  const fs = Math.round(clamp(c.s*0.1,10,13));
  ctx.font = `700 ${fs}px ${FONT}`;
  const t = STAGE_LABEL[st], tw = ctx.measureText(t).width;
  const h = fs + 7, w = Math.min(c.s - 10, tw + 10);
  rr(ctx,c.x + 5,c.y + 5,w,h,h/2); ctx.fillStyle = CHIP_BG[st]; ctx.fill();
  if (st === 'goku'){ ctx.strokeStyle = '#FFE08A'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = '#FFF8EE'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t, c.x + 10, c.y + 5 + h/2 + 0.5, w - 10);
}
function drawGauge(c, it){
  const T = TYPES[it.type], span = T.ready + T.win + 6;
  const x = c.x + 8, w = c.s - 16, h = 5, y = c.y + c.s - 11;
  const px = v => x + w*clamp(v/span,0,1);
  rr(ctx,x,y,w,h,2.5); ctx.fillStyle = 'rgba(40,22,10,.6)'; ctx.fill();
  ctx.fillStyle = 'rgba(255,248,230,.4)'; ctx.fillRect(px(T.ready*NAMA_RATIO), y, px(T.ready) - px(T.ready*NAMA_RATIO), h);
  ctx.fillStyle = '#8FD18F'; ctx.fillRect(px(T.ready), y, px(T.ready + T.win) - px(T.ready), h);
  const cc = T.ready + T.win/2;
  ctx.fillStyle = '#FFD54A'; ctx.fillRect(px(cc - T.win*GOKU_BAND), y, px(cc + T.win*GOKU_BAND) - px(cc - T.win*GOKU_BAND), h);
  const mx = px(it.t);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = 'rgba(40,22,10,.9)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(mx,y - 1); ctx.lineTo(mx - 4,y - 6); ctx.lineTo(mx + 4,y - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(mx - 1, y - 1, 2, h + 2);
}
function drawSteam(){
  for (const p of steam){
    const k = p.age/p.life, a = 0.3*(1-k)*Math.min(1,k*5), r = p.r*(1 + k*1.5);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ell(ctx,p.x,p.y,r,r); ctx.fill();
  }
}
function drawFx(dt){
  for (const f of fx) f.age += dt;
  fx = fx.filter(f => f.age < f.life);
  for (const f of fx){
    if (f.age < 0) continue;
    const k = clamp(f.age/f.life,0,1);
    if (f.k === 'fly'){
      const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2,2)/2;
      const x = f.x0 + (f.x1 - f.x0)*e, y = f.y0 + (f.y1 - f.y0)*e - Math.sin(e*Math.PI)*36;
      ctx.save(); ctx.translate(x,y); drawItem(ctx, f.type, f.t, f.s0 + (f.s1 - f.s0)*e, f.seed); ctx.restore();
    } else if (f.k === 'rip'){
      ctx.strokeStyle = `rgba(255,244,215,${0.7*(1-k)})`; ctx.lineWidth = 2;
      ell(ctx,f.x,f.y + f.s*0.05,f.s*(0.15 + k*0.32),f.s*(0.1 + k*0.22)); ctx.stroke();
    } else if (f.k === 'pop'){
      const al = k < 0.7 ? 1 : 1 - (k - 0.7)/0.3, sc = reduce ? 1 : (k < 0.12 ? 0.6 + k/0.12*0.4 : 1);
      ctx.save(); ctx.globalAlpha = al; ctx.font = `900 ${f.size}px ${FONT}`;
      const tw = ctx.measureText(f.text).width;
      const x = clamp(f.x, tw/2 + 6, Math.max(tw/2 + 6, W - tw/2 - 6)), y = f.y - (reduce ? 0 : k*24);
      ctx.translate(x,y); ctx.scale(sc,sc); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(38,24,14,.92)'; ctx.strokeText(f.text,0,0);
      ctx.fillStyle = f.fill; ctx.fillText(f.text,0,0);
      ctx.restore();
    }
  }
}

/* ---- DOMの表示更新 ---- */
function updateHud(g){
  const tl = Math.ceil(g.timeLeft - 1e-6), key = tl + '|' + g.score;
  if (key !== lastHud){
    lastHud = key;
    el.timeVal.textContent = tl;
    el.scoreVal.textContent = '¥' + g.score.toLocaleString('ja-JP');
    el.timeBox.classList.toggle('hurry', tl <= 10);
    if (tl <= 5 && tl > 0 && tl !== lastTick && state === 'playing'){ sfx('tick'); lastTick = tl; }
  }
  el.timeFill.style.transform = `scaleX(${g.timeLeft/g.duration})`;
}
function updateCellLabels(g){
  for (let i=0; i<CELLS; i++){
    const it = g.cells[i], key = it ? it.type + it.stage : '-';
    const b = cellBtns[i];
    if (b._k !== key){
      b._k = key;
      b.setAttribute('aria-label', it ? `${POS_NAME[i]}：${TYPES[it.type].name}、${STAGE_LABEL[it.stage].replace(/^[★◎△×]/,'')}` : `${POS_NAME[i]}：空き`);
    }
  }
}
function showBanner(text){
  el.banner.textContent = text;
  el.banner.classList.remove('show'); void el.banner.offsetWidth; el.banner.classList.add('show');
  clearTimeout(showBanner.t); showBanner.t = setTimeout(() => el.banner.classList.remove('show'), 1300);
}
function toast(msg){
  el.toast.textContent = msg; el.toast.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.toast.classList.remove('show'), 2200);
}

/* ---- 画面の切り替え ---- */
function resetFx(){ fx = []; steam = []; simmer = []; dropAnim.clear(); shake = 0; }
function startGame(){
  ensureAudio();
  game = newGame({});
  resetFx();
  state = 'playing'; lastHud = ''; lastTick = -1;
  el.title.hidden = true; el.result.hidden = true; el.hud.classList.remove('idle');
  sfx('clap'); showBanner('開店！');
}
function beginClosing(){
  state = 'closing'; closingT = 0;
  showBanner('閉店！'); sfx('clap');
}
function showResult(){
  state = 'over';
  const g = game, s = g.stats, j = judge(g), sc = g.score;
  const isBest = sc > best && sc > 0;
  if (isBest){ best = sc; save('oden-best', best); }
  const rate = s.served ? Math.round(s.good/s.served*100) : 0;
  el.resYen.textContent = '¥' + sc.toLocaleString('ja-JP');
  el.resTitle.textContent = j.title;
  el.resNote.textContent = j.note;
  const rows = [
    ['出した品数', `${s.served}品（★極上 ${s.best}）`],
    ['食べ頃率', `${rate}%`],
    ['満足して帰った客', `${s.happy}人`],
    ['待ちくたびれた客', `${s.angry}人`],
    ['まかない', s.loss ? `${s.makanai}個（−¥${s.loss.toLocaleString('ja-JP')}）` : `${s.makanai}個`],
    ['煮すぎ・溶けた具', s.meltLoss ? `${s.overFail}個（−¥${s.meltLoss.toLocaleString('ja-JP')}）` : `${s.overFail}個`],
  ];
  el.resStats.innerHTML = '';
  for (const [dt, dd] of rows){
    const a = document.createElement('dt'); a.textContent = dt;
    const b = document.createElement('dd'); b.textContent = dd;
    el.resStats.append(a, b);
  }
  el.newBest.hidden = !isBest;
  el.result.hidden = false; el.result.scrollTop = 0;
  const inner = el.slip.clientWidth - 40;
  el.resTitle.style.fontSize = Math.max(18, Math.min(34, Math.floor(inner/(j.title.length + 0.4)))) + 'px';
  el.resLive.textContent = `本日の売上 ${sc}円。称号は「${j.title}」。` + (isBest ? '自己ベスト更新。' : '');
  lastResult = { score:sc, title:j.title, best:s.best, rate };
  setTimeout(() => { try { el.again.focus({ preventScroll:true }); } catch (e){} }, 60);
}
function goTitle(){
  state = 'title'; game = null; demo = newGame({ demo:true }); resetFx();
  el.result.hidden = true; el.title.hidden = false; el.hud.classList.add('idle');
  el.bestTitle.textContent = '¥' + best.toLocaleString('ja-JP');
}
function shareText(){
  const r = lastResult; if (!r) return '';
  const url = String(location.href).split('#')[0];
  return `【おでん番】本日の売上 ¥${r.score.toLocaleString('ja-JP')}\n称号「${r.title}」\n★極上 ${r.best}品／食べ頃率 ${r.rate}%\n#おでん番\n${url}`;
}
async function share(){
  const text = shareText(); if (!text) return;
  if (navigator.share){
    try { await navigator.share({ text }); return; }
    catch (e){ if (e && e.name === 'AbortError') return; }
  }
  try {
    const w = window.open('https://x.com/intent/post?text=' + encodeURIComponent(text), '_blank');
    if (w){ try { w.opener = null; } catch (e){} return; }
  } catch (e){}
  copyText(text);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('投稿文をコピーしました'); return; } catch (e){}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    toast(ok ? '投稿文をコピーしました' : 'コピーできませんでした');
  } catch (e){ toast('コピーできませんでした'); }
}
function setMuted(m){
  muted = m; save('oden-muted', m ? '1' : '0');
  el.mute.classList.toggle('muted', m); el.mute.setAttribute('aria-pressed', m ? 'true' : 'false');
}

/* ---- 入力 ---- */
function tapCell(i){ if (state !== 'playing' || !game) return; serveCell(game, i); }
function tapTray(k){ if (state !== 'playing' || !game) return; addItem(game, k); }
function bindTap(b, fn){
  b.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault(); ensureAudio();
    b.classList.add('press'); clearTimeout(b._pt); b._pt = setTimeout(() => b.classList.remove('press'), 120);
    fn();
  });
  b.addEventListener('click', e => { if (e.detail === 0) fn(); }); // キーボード操作
}

/* ---- ループ ---- */
function frame(ts){
  const now = ts/1000;
  const dt = last ? Math.min(0.05, Math.max(0, now - last)) : 0;
  last = now; clock += dt;
  if (state === 'title'){
    if (!demo || demo.ended) demo = newGame({ demo:true });
    demo.aiCd -= dt;
    if (demo.aiCd <= 0){ aiAct(demo); demo.aiCd = 0.3 + demo.rnd()*0.2; }
    update(demo, dt); processEvents(demo, true); stepParticles(demo, dt); render(demo, dt);
  } else if (state === 'playing'){
    update(game, dt); processEvents(game, false); stepParticles(game, dt); render(game, dt);
    updateHud(game); updateCellLabels(game);
    if (game.ended) beginClosing();
  } else if (state === 'closing'){
    closingT += dt; stepParticles(game, dt); render(game, dt); updateHud(game);
    if (closingT > 1.6) showResult();
  } else if (game){
    stepParticles(game, dt); render(game, dt);
  }
  requestAnimationFrame(frame);
}

function boot(){
  const $ = id => document.getElementById(id);
  el = { stage:$('stage'), cells:$('cells'), tray:$('tray'), hud:$('hud'), timeBox:$('timeBox'), timeVal:$('timeVal'), scoreVal:$('scoreVal'),
         timeFill:$('timeFill'), banner:$('banner'), title:$('titleScreen'), result:$('resultScreen'), slip:$('slip'), resYen:$('resYen'),
         resTitle:$('resTitle'), resNote:$('resNote'), resStats:$('resStats'), newBest:$('newBest'), resLive:$('resLive'),
         again:$('againBtn'), share:$('shareBtn'), toTitle:$('toTitle'), start:$('startBtn'), mute:$('mute'), toast:$('toast'), bestTitle:$('bestTitle') };
  cv = $('cv'); ctx = cv.getContext('2d');

  for (let i=0; i<CELLS; i++){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cell'; b.setAttribute('aria-label', POS_NAME[i] + '：空き');
    bindTap(b, () => tapCell(i));
    el.cells.appendChild(b); cellBtns.push(b);
  }
  for (const k of TYPE_KEYS){
    const T = TYPES[k];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ing';
    const ic = document.createElement('canvas'); ic.className = 'ing-ic'; ic.setAttribute('aria-hidden','true');
    const nm = document.createElement('span'); nm.className = 'ing-name'; nm.textContent = T.name; nm.setAttribute('aria-hidden','true');
    const sc = document.createElement('span'); sc.className = 'ing-sec'; sc.textContent = Math.round(T.ready) + '秒'; sc.setAttribute('aria-hidden','true');
    b.append(ic, nm, sc);
    b.setAttribute('aria-label', `${T.name}を鍋に入れる（食べ頃まで約${Math.round(T.ready)}秒）`);
    bindTap(b, () => tapTray(k));
    el.tray.appendChild(b);
    trayBtns[k] = { b, cv:ic, ft:0 };
  }

  const mqR = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  reduce = !!(mqR && mqR.matches);
  if (mqR && mqR.addEventListener) mqR.addEventListener('change', e => { reduce = e.matches; });
  const mqD = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mqD && mqD.addEventListener) mqD.addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme','class','style'] });

  readTheme(); layout(); drawTrayIcons();
  window.addEventListener('resize', () => { layout(); drawTrayIcons(); });
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(el.stage);

  document.addEventListener('pointerdown', ensureAudio, { capture:true });
  document.addEventListener('keydown', ensureAudio, { capture:true });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  el.start.addEventListener('click', startGame);
  el.again.addEventListener('click', startGame);
  el.share.addEventListener('click', share);
  el.toTitle.addEventListener('click', goTitle);
  el.mute.addEventListener('click', () => { ensureAudio(); setMuted(!muted); });
  setMuted(muted);

  el.bestTitle.textContent = '¥' + best.toLocaleString('ja-JP');
  $('verLine').textContent = VERSION;
  demo = newGame({ demo:true });
  requestAnimationFrame(frame);
}
function drawTrayIcons(){
  const d = Math.min(2, window.devicePixelRatio || 1);
  for (const k of TYPE_KEYS){
    const c = trayBtns[k].cv; c.width = c.height = Math.round(38*d);
    const x = c.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,38,38); x.translate(19,20);
    drawItem(x, k, 0, 30, 7);
  }
}

// 確認用（自動テストから使う）
globalThis.__oden = {
  newGame, update, addItem, serveCell, aiDecide, aiAct, stageOf, judge, demandOf, TYPES, VALUE,
  get state(){ return state; }, get game(){ return game; },
  decide(){ return game ? aiDecide(game) : null; },
  show(g, st){ game = g; state = st || 'frozen'; resetFx(); el.title.hidden = true; el.result.hidden = true; el.hud.classList.remove('idle'); updateHud(g); },
  result(g){ game = g; resetFx(); el.title.hidden = true; el.hud.classList.remove('idle'); updateHud(g); showResult(); },
};

if (typeof document !== 'undefined'){
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}
</script>
</body>
